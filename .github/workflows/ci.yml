name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint & test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The POST /recommend integration test stubs the retrieval / reranking /
      # explanation services in tests/conftest.py *before* importing the app, so it
      # runs fully offline — no BGE-M3, LightGBM, Postgres, or Gemini key required.
      # That means CI only needs the web framework + test tools, not the heavy ML
      # deps (torch etc.), which keeps each run to ~40s. If the app ever gains a
      # top-level heavy import outside the stubbed services, add it here.
      - name: Install dependencies
        run: pip install "fastapi>=0.128.0,<0.129.0" pytest httpx ruff

      # Advisory for now (won't fail the build) — flip to a blocking gate once the
      # codebase is lint-clean by removing `continue-on-error`.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      # The hard gate: the /recommend integration test must pass.
      - name: Run tests
        run: python -m pytest -v
