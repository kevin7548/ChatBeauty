# Keeps the free-tier stack alive by USING it, and self-heals the backend.
#
# History / why it looks like this:
#   v1 (2026-07-10) pinged the DB with `psql SELECT 1`. That ping succeeded every
#   day from 07-10 to 07-16 and Supabase auto-paused the project anyway on 07-17
#   — a bare pooler query does not appear to count as project activity. v1 also
#   ran the DB step first under `bash -e`, so once the DB was down the job died
#   at step 1 and the Space-restart step never ran, disabling the self-healing.
#
# v2 therefore:
#   - drives a REAL product search (POST /recommend) instead of a bare ping, so
#     the whole stack gets exercised the way a visitor would: Space HTTP ->
#     BGE-M3 encode -> FAISS ANN -> a genuine `products` SELECT -> LightGBM ->
#     Gemini. This is normal application traffic, which is what Supabase's
#     activity tracking is meant to see.
#   - restarts a crashed Space FIRST (a Space in RUNTIME_ERROR never recovers on
#     its own), because the search can't run until the backend is up.
#   - runs every step with `if: always()` and decides pass/fail at the end, so
#     one broken layer can no longer mask the others. A red run means the site is
#     genuinely down and GitHub emails you — free uptime monitoring.
#
# NOTE: if Supabase still pauses despite real traffic, the free tier simply
# cannot be kept awake from outside and the fix is a plan/host change, not a
# smarter cron. See docs/deployment.md.
#
# Required repo secrets: HF_TOKEN (write access to the Space).
# Optional: SUPABASE_DB_URL — only used for a diagnostic ping that never fails
# the run on its own.

name: Keep free-tier services awake

on:
  schedule:
    # Twice daily (07:23 and 19:23 KST). More than enough for the ~7-day pause
    # window and the ~48h Space sleep window, and cheap: 2 Gemini calls a day.
    - cron: "23 22 * * *"
    - cron: "23 10 * * *"
  workflow_dispatch:

# Never let two runs restart the Space at the same time.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      SPACE_API: https://huggingface.co/api/spaces/kevin7548/chatbeauty-backend
      BASE_URL: https://kevin7548-chatbeauty-backend.hf.space
    steps:
      # ---------------------------------------------------------------- backend
      - name: Wake the backend Space (restart it if it crashed)
        id: space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -u
          health() { curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/health" || true; }

          if [ "$(health)" = "200" ]; then
            echo "Space already healthy."
            exit 0
          fi

          stage=$(curl -s "$SPACE_API" | jq -r '.runtime.stage')
          echo "Space not healthy (stage: $stage)"

          # These states never recover on their own — kick a restart.
          case "$stage" in
            RUNTIME_ERROR|BUILD_ERROR|STOPPED|PAUSED|SLEEPING)
              echo "Restarting Space via the HF API..."
              curl -sf -X POST -H "Authorization: Bearer $HF_TOKEN" "$SPACE_API/restart" > /dev/null \
                || echo "Restart call failed (bad/expired HF_TOKEN?)"
              ;;
          esac

          # A cold start re-downloads ~2.6 GB of model + FAISS index; allow ~12 min.
          for i in $(seq 1 24); do
            sleep 30
            code=$(health)
            echo "attempt $i: /health -> $code"
            if [ "$code" = "200" ]; then
              echo "Space is up."
              exit 0
            fi
          done

          echo "::error::Space did not come up. If the DB is paused it will crash on boot forever."
          exit 1

      # ------------------------------------------------------- the real traffic
      # This is the step that matters for keeping the project active: a genuine
      # end-to-end product search, identical to what the website sends.
      - name: Run a real product search
        id: search
        if: always()
        run: |
          set -u

          # Rotate the query by day so we never look like a single cached request.
          queries=(
            "I have thin hair and want a volumizing shampoo"
            "gentle fragrance-free moisturizer for sensitive dry skin"
            "long-lasting matte lipstick for oily skin"
            "sunscreen for daily use that doesn't leave a white cast"
            "anti-frizz hair serum for humid weather"
            "vitamin C serum for dark spots and dull skin"
            "waterproof mascara that is easy to remove"
          )
          q="${queries[$(( $(date +%j) % ${#queries[@]} ))]}"
          echo "Query: $q"

          body=$(jq -nc --arg u "$q" '{user_input: $u}')
          code=$(curl -s --max-time 180 -o resp.json -w "%{http_code}" \
                   -X POST "$BASE_URL/recommend" \
                   -H "Content-Type: application/json" \
                   -d "$body" || echo "000")

          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- response ---"; head -c 800 resp.json || true; echo
            echo "::error::Product search failed (HTTP $code) — the site is down for visitors."
            exit 1
          fi

          # A 200 with zero results still means the DB read is broken, so assert
          # we actually got products back.
          n=$(jq '.recommendations | length' resp.json)
          echo "recommendations: $n"
          jq -r '.latency // {} | to_entries[] | "  \(.key): \(.value)"' resp.json || true
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Search returned 0 products — retrieval or the DB read is broken."
            exit 1
          fi
          jq -r '.recommendations[0].item_name // .recommendations[0].title // "?"' resp.json \
            | sed 's/^/  top hit: /'
          echo "Search OK — the stack was exercised end to end."

      # ------------------------------------------------------------ diagnostics
      # Advisory only: tells the difference between "DB paused" and "Space broken"
      # in the failure email. Never fails the run by itself.
      - name: Diagnostic — direct DB reachability
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "SUPABASE_DB_URL not set — skipping."
            exit 0
          fi
          if psql "$DATABASE_URL" -tAc "SELECT count(*) FROM products;" 2>db_err.txt; then
            echo "DB reachable."
          else
            echo "DB UNREACHABLE:"; cat db_err.txt
            if grep -q "ENOTFOUND\|not found" db_err.txt; then
              echo "Looks like the Supabase project is PAUSED — restore it from the dashboard;"
              echo "no amount of retrying from CI can bring a paused project back."
            fi
          fi

      # Single place that decides the run's colour, so no earlier failure can
      # short-circuit the steps after it.
      - name: Report
        if: always()
        run: |
          echo "Space wake : ${{ steps.space.outcome }}"
          echo "Product search: ${{ steps.search.outcome }}"
          if [ "${{ steps.search.outcome }}" != "success" ]; then
            echo "::error::Keep-alive failed — ChatBeauty is not serving recommendations."
            exit 1
          fi
          echo "ChatBeauty is alive."
