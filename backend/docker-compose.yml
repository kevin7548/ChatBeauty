services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatbeauty
      POSTGRES_USER: chatbeauty
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chatbeauty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://chatbeauty:${DB_PASSWORD:-chatbeauty}@db:5432/chatbeauty
    depends_on:
      - db
    volumes:
      # Model artifacts, read-only, at the backend's default paths (/app/ml/model/...):
      #   retrieval/bge-m3-finetuned-20260202-120852/   BGE-M3 query encoder
      #   retrieval/ann/{faiss_hnsw_cosine.index,asins.json}   in-memory FAISS index
      #   reranking/lgbm_reranker_current_features_v1.pkl      LightGBM reranker
      # Fetch them from the HF Hub model repo first — see docs/development.md.
      - ../ml/model:/app/ml/model:ro
    restart: unless-stopped

volumes:
  pgdata:
